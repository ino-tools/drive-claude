name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log || {
            msg=$(grep -E "error:|What went wrong|Execution failed|AAPT|resource" -A3 build.log | head -40 | sed ':a;N;$!ba;s/\n/%0A/g')
            echo "::error title=build-failed::$msg"
            exit 1
          }

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk drive-claude.apk

      - uses: actions/upload-artifact@v4
        with:
          name: drive-claude-apk
          path: drive-claude.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: build-${{ github.run_number }}
          make_latest: true
          files: drive-claude.apk
